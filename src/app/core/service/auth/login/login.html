<app-auth-layout title="Welcome back" subtitle="Sign in to continue your climb.">
  @if (verified() === 'true' && !serverError()) {
    <app-form-alert tone="success" class="mb-6">
      Your email is verified. Sign in to get started.
    </app-form-alert>
  }

  @if (serverError(); as message) {
    <app-form-alert class="mb-6">
      {{ message }}
      @if (needsVerification()) {
        <button type="button" class="ml-1 font-semibold underline" (click)="goToVerification()">
          Verify your email
        </button>
      }
    </app-form-alert>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-5">
    <div>
      <label for="email" class="mb-1.5 block text-sm font-medium text-ink">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        inputmode="email"
        placeholder="name@example.com"
        [class]="inputClasses(showError('email'))"
        [attr.aria-invalid]="showError('email')"
        [attr.aria-describedby]="showError('email') ? 'email-error' : null"
      />
      <app-field-error [control]="form.controls.email" label="Email" errorId="email-error" />
    </div>

    <div>
      <div class="mb-1.5 flex items-center justify-between">
        <label for="password" class="block text-sm font-medium text-ink">Password</label>
        <a routerLink="/forgot-password" class="text-xs font-semibold text-royal hover:underline"
          >Forgot password?</a
        >
      </div>
      <div class="relative">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [class]="inputClasses(showError('password')) + ' pr-16'"
          [attr.aria-invalid]="showError('password')"
          [attr.aria-describedby]="showError('password') ? 'password-error' : null"
        />
        <button
          type="button"
          class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-royal hover:underline"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
          <span class="sr-only">password</span>
        </button>
      </div>
      <app-field-error
        [control]="form.controls.password"
        label="Password"
        errorId="password-error"
      />
    </div>

    <button
      type="submit"
      class="flex w-full items-center justify-center gap-2 rounded-lg bg-ladder px-5 py-3 text-sm font-semibold text-ink transition-colors hover:bg-ladder-light disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="submitting()"
    >
      @if (submitting()) {
        <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25" />
          <path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" />
        </svg>
        Signing in…
      } @else {
        Sign in
      }
    </button>
  </form>

  <div class="mt-6 flex items-center gap-3 text-xs text-muted">
    <span class="h-px flex-1 bg-line"></span>or<span class="h-px flex-1 bg-line"></span>
  </div>
  <a
    routerLink="/magic-link"
    class="mt-6 block rounded-lg border border-line bg-white px-5 py-3 text-center text-sm font-semibold text-ink transition-colors hover:border-royal/40"
    >Email me a sign-in link</a
  >

  <p class="mt-8 text-center text-sm text-muted">
    New to Learning Ladder?
    <a routerLink="/register" class="font-semibold text-royal hover:underline">Create an account</a>
  </p>
</app-auth-layout>
