<app-modal
  heading="Delete your account?"
  description="Your account will be closed and every session signed out. You will not be able to sign in with it again."
  tone="danger"
  [busy]="submitting()"
  (closed)="cancelled.emit()"
>
  @if (serverError(); as message) {
    <app-form-alert class="mb-4">{{ message }}</app-form-alert>
  }
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-4">
    <div>
      <label for="delete-password" class="mb-1.5 block text-sm font-medium"
        >Confirm with your password</label
      >
      <div class="relative">
        <input
          id="delete-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [class]="inputClasses(showError('password')) + ' pr-16'"
          [attr.aria-invalid]="showError('password')"
          [attr.aria-describedby]="showError('password') ? 'delete-password-error' : null"
        />
        <button
          type="button"
          class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-royal hover:underline"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      <app-field-error
        [control]="form.controls.password"
        label="Password"
        errorId="delete-password-error"
      />
    </div>

    <div>
      <label for="delete-reason" class="mb-1.5 block text-sm font-medium">
        Reason <span class="font-normal text-muted">(optional)</span>
      </label>
      <textarea
        id="delete-reason"
        rows="3"
        formControlName="reason"
        maxlength="500"
        [class]="inputClasses(showError('reason')) + ' resize-none'"
        [attr.aria-invalid]="showError('reason')"
        [attr.aria-describedby]="showError('reason') ? 'delete-reason-error' : null"
      ></textarea>
      <app-field-error
        [control]="form.controls.reason"
        label="Reason"
        errorId="delete-reason-error"
      />
    </div>

    <div class="flex flex-col-reverse gap-2 pt-2 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="rounded-lg border border-line px-4 py-2.5 text-sm font-semibold text-ink hover:bg-slate-50 disabled:opacity-60"
        [disabled]="submitting()"
        (click)="cancelled.emit()"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="rounded-lg bg-rose-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-rose-700 disabled:opacity-60"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Deleting…' : 'Delete my account' }}
      </button>
    </div>
  </form>
</app-modal>
