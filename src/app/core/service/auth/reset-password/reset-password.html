<app-auth-layout title="Choose a new password" subtitle="You'll use it the next time you sign in.">
  @if (!hasToken()) {
    <app-form-alert class="mb-6">
      This reset link is incomplete. Open the link from the email again, or request a new one.
    </app-form-alert>
    <a
      routerLink="/forgot-password"
      class="block rounded-lg bg-ladder px-5 py-3 text-center text-sm font-semibold text-ink transition-colors hover:bg-ladder-light"
      >Request a new link</a
    >
  } @else {
    @if (serverError(); as message) {
      <app-form-alert class="mb-6">
        {{ message }}
        @if (linkRejected()) {
          <a routerLink="/forgot-password" class="ml-1 font-semibold underline"
            >Request a new link</a
          >
        }
      </app-form-alert>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-5">
      <div>
        <label for="newPassword" class="mb-1.5 block text-sm font-medium text-ink"
          >New password</label
        >
        <div class="relative">
          <input
            id="newPassword"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="newPassword"
            autocomplete="new-password"
            [class]="inputClasses(showError('newPassword')) + ' pr-16'"
            [attr.aria-invalid]="showError('newPassword')"
            aria-describedby="newPassword-error password-rules"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-royal hover:underline"
            [attr.aria-pressed]="showPassword()"
            (click)="showPassword.set(!showPassword())"
          >
            {{ showPassword() ? 'Hide' : 'Show' }}
            <span class="sr-only">password</span>
          </button>
        </div>
        <app-field-error
          [control]="form.controls.newPassword"
          label="New password"
          errorId="newPassword-error"
        />
        <app-password-checklist
          [value]="form.controls.newPassword.value"
          [showErrors]="showError('newPassword')"
        />
      </div>

      <div>
        <label for="confirmPassword" class="mb-1.5 block text-sm font-medium text-ink"
          >Confirm new password</label
        >
        <input
          id="confirmPassword"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
          [class]="inputClasses(showError('confirmPassword'))"
          [attr.aria-invalid]="showError('confirmPassword')"
          [attr.aria-describedby]="showError('confirmPassword') ? 'confirmPassword-error' : null"
        />
        <app-field-error
          [control]="form.controls.confirmPassword"
          label="Confirm password"
          errorId="confirmPassword-error"
        />
      </div>

      <button
        type="submit"
        class="flex w-full items-center justify-center gap-2 rounded-lg bg-ladder px-5 py-3 text-sm font-semibold text-ink transition-colors hover:bg-ladder-light disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="submitting()"
      >
        @if (submitting()) {
          <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25" />
            <path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" />
          </svg>
          Saving…
        } @else {
          Save new password
        }
      </button>
    </form>
  }

  <p class="mt-8 text-center text-sm text-muted">
    <a routerLink="/login" class="font-semibold text-royal hover:underline">Back to sign in</a>
  </p>
</app-auth-layout>
