<app-auth-layout
  title="Create your account"
  subtitle="Join Learning Ladder as a student. It takes under a minute."
>
  @if (serverError(); as message) {
    <app-form-alert class="mb-6">
      {{ message }}
      @if (message.toLowerCase().includes('already exists')) {
        <a routerLink="/login" class="ml-1 font-semibold underline">Sign in instead</a>
      }
    </app-form-alert>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-5">
    <div class="grid gap-5 sm:grid-cols-2">
      <div>
        <label for="firstName" class="mb-1.5 block text-sm font-medium text-ink">First name</label>
        <input
          id="firstName"
          type="text"
          formControlName="firstName"
          autocomplete="given-name"
          [class]="inputClasses(showError('firstName'))"
          [attr.aria-invalid]="showError('firstName')"
          [attr.aria-describedby]="showError('firstName') ? 'firstName-error' : null"
        />
        <app-field-error
          [control]="form.controls.firstName"
          label="First name"
          errorId="firstName-error"
          patternMessage="First name must start with a letter and use only letters, spaces, apostrophes, dots or hyphens."
        />
      </div>

      <div>
        <label for="lastName" class="mb-1.5 block text-sm font-medium text-ink">Last name</label>
        <input
          id="lastName"
          type="text"
          formControlName="lastName"
          autocomplete="family-name"
          [class]="inputClasses(showError('lastName'))"
          [attr.aria-invalid]="showError('lastName')"
          [attr.aria-describedby]="showError('lastName') ? 'lastName-error' : null"
        />
        <app-field-error
          [control]="form.controls.lastName"
          label="Last name"
          errorId="lastName-error"
          patternMessage="Last name must start with a letter and use only letters, spaces, apostrophes, dots or hyphens."
        />
      </div>
    </div>

    <div>
      <label for="email" class="mb-1.5 block text-sm font-medium text-ink">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        placeholder="name@example.com"
        [class]="inputClasses(showError('email'))"
        [attr.aria-invalid]="showError('email')"
        [attr.aria-describedby]="showError('email') ? 'email-error' : null"
      />
      <app-field-error [control]="form.controls.email" label="Email" errorId="email-error" />
    </div>

    <div>
      <label for="password" class="mb-1.5 block text-sm font-medium text-ink">Password</label>
      <div class="relative">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
          [class]="inputClasses(showError('password')) + ' pr-16'"
          [attr.aria-invalid]="showError('password')"
          aria-describedby="password-rules"
        />
        <button
          type="button"
          class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-royal hover:underline"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
          <span class="sr-only">password</span>
        </button>
      </div>
      <app-field-error [control]="form.controls.password" label="Password" />
      <app-password-checklist
        [value]="form.controls.password.value"
        [showErrors]="showError('password')"
      />
    </div>

    <div>
      <label for="confirmPassword" class="mb-1.5 block text-sm font-medium text-ink"
        >Confirm password</label
      >
      <input
        id="confirmPassword"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [class]="inputClasses(showError('confirmPassword'))"
        [attr.aria-invalid]="showError('confirmPassword')"
        [attr.aria-describedby]="showError('confirmPassword') ? 'confirmPassword-error' : null"
      />
      <app-field-error
        [control]="form.controls.confirmPassword"
        label="Confirm password"
        errorId="confirmPassword-error"
      />
    </div>

    <button
      type="submit"
      class="flex w-full items-center justify-center gap-2 rounded-lg bg-ladder px-5 py-3 text-sm font-semibold text-ink transition-colors hover:bg-ladder-light disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="submitting()"
    >
      @if (submitting()) {
        <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25" />
          <path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="3" />
        </svg>
        Creating your account…
      } @else {
        Create account
      }
    </button>

    <p class="text-xs text-muted">
      By creating an account you agree to our Terms and Privacy Policy.
    </p>
  </form>

  <div class="mt-6 flex items-center gap-3 text-xs text-muted">
    <span class="h-px flex-1 bg-line"></span>or<span class="h-px flex-1 bg-line"></span>
  </div>
  <app-google-auth class="mt-6 block" />

  <p class="mt-8 text-center text-sm text-muted">
    Already have an account?
    <a routerLink="/login" class="font-semibold text-royal hover:underline">Sign in</a>
  </p>
</app-auth-layout>
